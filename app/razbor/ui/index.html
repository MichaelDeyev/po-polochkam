<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>По полочкам</title>
<link rel="icon" href="/icon.png" sizes="192x192">
<style>
:root{--bg:#fafaf8;--fg:#1d1d1b;--mut:#65655f;--card:#fff;--line:#e3e2dc;--keep:#2f7d4f;--keep-bg:#e7f3ec;--drop:#b4532a;--drop-bg:#f8e9e2;--on:#fff;--warn-bg:#fbf2d9;--warn:#7a5a00}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--fg:#ecebe6;--mut:#a9a8a2;--card:#252524;--line:#3a3a37;--keep:#6cc08f;--keep-bg:#22382b;--drop:#e08a63;--drop-bg:#3d2a21;--on:#1b1b1a;--warn-bg:#3a3118;--warn:#e6c76b}}
:root{color-scheme:light dark}*{box-sizing:border-box}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Segoe UI",sans-serif;margin:0;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:16px;display:flex;align-items:center;gap:8px}header b img{width:24px;height:24px}nav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
nav button{border:0;background:none;padding:6px 10px;font-weight:500;color:var(--mut)}
nav button.on{background:var(--keep-bg);color:var(--keep);font-weight:700}
nav button:disabled{opacity:.45;cursor:default}
nav button.next:not(.on){color:var(--keep);box-shadow:inset 0 -2px 0 var(--keep);border-radius:6px 6px 0 0}
.nextstep{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;max-width:860px;margin:0 auto 12px;padding:10px 14px;border:2px solid var(--keep);border-radius:10px;background:var(--keep-bg)}
.nextstep .mut{flex-basis:100%}.nextstep b{flex:1;min-width:220px}
main{flex:1;min-height:0;overflow:auto;padding:16px}
.wrap{max-width:860px;margin:0 auto}
h1{font-size:22px;margin:4px 0 8px}h2{font-size:16px;margin:20px 0 6px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0;white-space:pre-wrap}
button{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.main{background:var(--keep);border-color:var(--keep);color:var(--on)}
button.danger{border-color:var(--drop);color:var(--drop)}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{border:1px solid var(--line);border-radius:8px;max-height:44vh;overflow:auto;margin:8px 0}
.item{display:flex;gap:10px;align-items:center;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;font-weight:400;padding:8px 10px}
.item:last-child{border-bottom:0}.item span.g{flex:1;min-width:0;word-break:break-word}
.opt{display:flex;gap:10px;padding:7px 0;align-items:flex-start}.opt input{margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}td.p{word-break:break-all;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--keep);width:0}
.bar.wait i{width:30%;animation:go 1.4s infinite ease-in-out}@keyframes go{0%{margin-left:-30%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar.wait i{animation:none;width:100%;opacity:.4}}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);max-width:min(520px,92vw);padding:18px}
dialog::backdrop{background:#0006}
/* разбор */
#rv{display:flex;flex-direction:column;height:100%}
#rvbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:0 0 8px}
#grid{flex:1;min-height:0;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--tile,300px)),1fr));gap:10px;align-content:start;padding:2px}
.ph{background:var(--card);border:3px solid var(--keep);border-radius:12px;padding:8px;min-width:0;cursor:pointer}
.ph.keep{background:var(--keep-bg)}.ph.drop{border-color:var(--drop);background:var(--drop-bg)}
.ph img{display:block;width:100%;height:var(--img,50vh);min-height:150px;object-fit:contain;border-radius:8px;background:var(--bg)}
.ph.drop img{opacity:.55}
.editnote{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:3px 8px;margin-bottom:6px}
.mark{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.badge{padding:4px 10px;border-radius:6px;background:var(--keep);color:var(--on);font-weight:700}.drop .badge{background:var(--drop)}
.mark button{font-size:12px;padding:4px 8px}.key{color:var(--mut);font-size:12px}
.info{font-size:12px;color:var(--mut);margin-top:6px;word-break:break-word}
.info button{font-size:12px;font-weight:400;padding:0;border:0;background:none;color:inherit;text-decoration:underline}
#rvfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding-top:10px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:6px}
.thumbs img{width:100%;height:120px;object-fit:contain;background:var(--bg);border-radius:6px}
/* без даты */
.ckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px}
.ck{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.ck.set{border-color:var(--keep);background:var(--keep-bg)}
.ck .pic{display:block;width:100%;height:200px;object-fit:contain;background:var(--bg);border-radius:6px;cursor:pointer}
.ck input[type=month],.ck input[type=number],.ckbulk input{font:inherit;padding:5px}
.hint{text-align:left;font-weight:400;display:flex;gap:8px;align-items:center}
.hint img{width:44px;height:44px;object-fit:cover;border-radius:4px;flex:none}
/* обучение */
#tour{width:min(680px,94vw);max-width:none;max-height:92vh;padding:0;overflow:hidden}
#tour[open]{display:flex;flex-direction:column}
#tourbody{padding:16px 20px;overflow:auto;flex:1;min-height:0}
#tourbody h2{font-size:20px;margin:6px 0 8px}
#tourtop{display:flex;align-items:center;gap:10px;padding:14px 20px 0}
#tourdots{display:flex;gap:6px;flex:1}#tourdots i{height:5px;flex:1;border-radius:3px;background:var(--line)}#tourdots i.on{background:var(--keep)}
#tourfoot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 20px;border-top:1px solid var(--line)}
.points{display:grid;gap:8px;margin:10px 0}
.point{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.point b{display:block}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--keep);color:var(--on);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.way{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px 10px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.way code{font:inherit;word-break:break-word}.way span{color:var(--mut)}
.demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.demo .ph{padding:6px;border-radius:10px}.demo .ph:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.demo .ph.drop svg{opacity:.55}.demo svg{display:block;width:100%;height:auto;border-radius:6px}
.demo .mark{margin-bottom:4px}.demo .badge{font-size:12px;padding:2px 7px}
.demo .mark button{font-size:11px;padding:2px 6px}
#tourfeedback{min-height:42px;margin:6px 0 0}
@media (max-width:520px){.demo{grid-template-columns:1fr 1fr}#tourfoot{justify-content:center}}
</style>
</head>
<body>
<header><b><img src="/icon.png" alt="">По полочкам</b><nav id="nav"></nav><span id="rootname" class="mut"></span><button id="pausebtn" type="button" hidden title="Сохранить всё и отпустить диск, чтобы его можно было безопасно извлечь">Пауза</button><button id="tourbtn" type="button">Обучение</button><button id="aboutbtn" type="button">О программе</button><button id="quit" type="button">Выйти</button></header>
<main id="main"></main>
<dialog id="dlg"><h2 id="dlgt" style="margin-top:0"></h2><div id="dlgb" style="white-space:pre-wrap"></div>
<div class="row" style="justify-content:flex-end;margin-top:14px"><button id="dlgno" type="button">Отмена</button><button id="dlgok" class="main" type="button"></button></div></dialog>
<dialog id="disk" aria-labelledby="diskt"><h2 id="diskt" style="margin-top:0"></h2><div id="diskb" style="white-space:pre-wrap"></div><p id="diskwait" class="mut" role="status"></p>
<div class="row" style="justify-content:flex-end;margin-top:14px"><button id="diskpick" type="button">Выбрать папку заново</button><button id="diskquit" type="button">Закрыть программу</button><button id="diskgo" class="main" type="button">Продолжить</button></div></dialog>
<dialog id="about" aria-labelledby="abouttitle"><h2 id="abouttitle" style="margin-top:0;display:flex;align-items:center;gap:10px"><img src="/icon.png" alt="" width="40" height="40">По полочкам</h2>
<p id="aboutver"></p>
<p class="mut">Работает без интернета. Если что-то пошло не так, сохраните отчёт и отправьте его автору программы. В отчёте нет снимков, только версия, сведения о Windows, ход операций и журнал ошибок. Это обычный текстовый файл: его можно открыть и прочитать перед отправкой.</p>
<label for="aboutnote">Что случилось (по желанию)</label>
<textarea id="aboutnote" rows="3" style="width:100%;font:inherit;padding:6px;margin:4px 0 10px"></textarea>
<div id="aboutdone" class="notice" hidden></div>
<div class="row" style="justify-content:flex-end"><button id="aboutclose" type="button">Закрыть</button><button id="aboutsave" class="main" type="button">Сохранить отчёт на рабочий стол</button></div></dialog>
<dialog id="tour" aria-labelledby="tourtitle"><div id="tourtop"><div id="tourdots"></div><span id="tourstep" class="mut"></span></div><div id="tourbody"></div><div id="tourfoot"></div></dialog>
<script>
const TOKEN = "{{TOKEN}}";
history.replaceState(null, "", "/");
const $ = id => document.getElementById(id);
const main = $("main");
let S = {}, screen = "pick", rv = {mode: "dups", pos: 0, group: null}, pollT = null;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === "on") for (const [ev, f] of Object.entries(v)) e.addEventListener(ev, f);
    else if (k === "cls") e.className = v;
    else if (k in e && k !== "list") e[k] = v;
    else e.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined) e.append(k);
  return e;
}
const btn = (label, fn, cls) => el("button", {type: "button", cls: cls || "", on: {click: fn}}, label);
const num = n => (n ?? 0).toLocaleString("ru-RU");
function size(b) {
  if (b > 0 && b < 2**20) return "меньше 1 МБ";
  if (b >= 2**30) return (b / 2**30).toLocaleString("ru-RU", {maximumFractionDigits: 1}) + " ГБ";
  return Math.round(b / 2**20).toLocaleString("ru-RU") + " МБ";
}
function minutes(sec) {
  if (sec < 60) return "меньше минуты";
  const m = Math.round(sec / 60);
  if (m < 60) return "примерно " + m + " мин";
  return "примерно " + Math.floor(m / 60) + " ч " + (m % 60) + " мин";
}
// Запросы, которым не нужен диск: они работают и при паузе, и когда диск отключён.
const NO_DISK = new Set(["/api/state", "/api/disk", "/api/pause", "/api/resume", "/api/ping", "/api/bye", "/api/client_error", "/api/quit",
  "/api/open", "/api/pick_folder", "/api/report_problem", "/api/tutorial/done"]);
// Пометки, поставленные без диска, не теряются: их отправим, когда диск вернётся.
const RETRY = new Set(["/api/review/mark", "/api/check/set"]);
async function request(path, init) {
  const base = path.split("?")[0];
  if (disk.state !== "ok" && !NO_DISK.has(base)) return hold(base, path, init);
  const r = await fetch(path, init);
  const j = await r.json();
  if (r.status === 503 && j.disk) { diskDown(j.disk); return hold(base, path, init); }
  return j;
}
// Ответа не будет, пока нет диска: экран перерисуется, когда диск вернётся, а пометки уйдут из очереди.
function hold(base, path, init) {
  if (RETRY.has(base)) disk.queue.push([path, init]);
  return new Promise(() => {});
}
const get = path => request(path, {headers: {"X-Token": TOKEN}});
const post = (path, data) => request(path, {method: "POST", headers: {"X-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify(data || {})});

/* ---------- отключённый диск и пауза ---------- */
const disk = {state: "ok", queue: [], timer: null};
function drawDisk() {
  const paused = disk.state === "paused", n = disk.queue.length;
  $("diskt").textContent = paused ? "Пауза" : "Диск отключён";
  $("diskb").textContent = paused
    ? "Всё сохранено, программа не держит диск. Его можно безопасно извлечь через значок в углу экрана.\n\nЧтобы продолжить, подключите диск и нажмите «Продолжить»."
    : "Папка «" + (S.root || "") + "» больше не видна: похоже, диск отключили. Всё, что вы сделали до этого, сохранено" +
      (n ? ", а последние пометки (" + n + ") запишутся, когда диск вернётся." : ".") +
      "\n\nПодключите диск — программа продолжит сама, с того же места.\nЕсли Windows дала диску другую букву, нажмите «Выбрать папку заново» и укажите его.";
  $("diskgo").hidden = !paused;
  $("diskpick").hidden = paused;
  $("diskwait").textContent = paused ? "" : "Ждём диск…";
}
function diskDown(state) {
  if (state === "ok") return;
  disk.state = state;
  drawDisk();
  if (!$("disk").open) $("disk").showModal();
  if (!disk.timer) disk.timer = setInterval(watchDisk, 2000);
}
async function watchDisk() {
  let r;
  try { r = await (await fetch("/api/disk", {headers: {"X-Token": TOKEN}})).json(); } catch (e) { return; }
  if (r.disk === "ok") return diskUp();
  if (r.disk !== disk.state) { disk.state = r.disk; drawDisk(); }
}
async function diskUp() {
  clearInterval(disk.timer); disk.timer = null;
  disk.state = "ok";
  const queue = disk.queue.splice(0);
  for (let i = 0; i < queue.length; i++) {        // пометки — в том порядке, в каком их ставили
    if (!await sent(...queue[i])) {               // диск снова пропал: текущая уже в очереди, добавляем остальные
      disk.queue.push(...queue.slice(i + 1));
      return;
    }
  }
  $("disk").close();
  if (screen === "review" && rv.group) rv.keepPos = rv.pos;
  go(screen || "report");
}
// true — запрос выполнен; false — диск снова пропал, пока он шёл (тогда он сам встал в очередь).
function sent(path, init) {
  return new Promise(res => {
    const t = setInterval(() => { if (disk.state !== "ok") { clearInterval(t); res(false); } }, 200);
    request(path, init).then(() => { clearInterval(t); res(true); });
  });
}
$("disk").addEventListener("cancel", e => e.preventDefault());     // Esc окно не закрывает: без диска работать нельзя
$("diskgo").onclick = async () => {
  $("diskgo").disabled = true;
  const r = await post("/api/resume");
  $("diskgo").disabled = false;
  if (r.disk === "ok") return diskUp();
  $("diskwait").textContent = r.error || "";
};
$("diskpick").onclick = () => {
  clearInterval(disk.timer); disk.timer = null;
  const lost = disk.queue.length;
  disk.queue = []; disk.state = "ok";       // в другой папке эти номера снимков значат другое
  $("disk").close();
  go("pick");
  if (lost) tell("Последние пометки не записаны", "Пометок, поставленных без диска: " + lost + ". Когда папка откроется, поставьте их ещё раз.");
};
$("diskquit").onclick = () => { $("disk").close(); $("quit").click(); };
$("pausebtn").onclick = async () => {
  const busy = S.job && S.job.status === "running";
  const ok = await ask("Поставить на паузу?", "Программа сохранит всё и отпустит диск: после этого его можно безопасно извлечь." +
    (busy ? "\nИдущая работа остановится и потом продолжится с того же места." : ""), "Пауза");
  if (!ok) return;
  const r = await post("/api/pause");
  if (r.error) return tell("Не получилось", r.error);
  diskDown(r.disk);
};
// Диск могут выдернуть, когда на экране ничего не происходит: проверяем сами.
setInterval(() => { if (S.root && disk.state === "ok") get("/api/disk").then(r => { if (r.disk !== "ok") diskDown(r.disk); }); }, 3000);
function ask(title, text, ok, oneButton) {
  return new Promise(res => {
    $("dlgt").textContent = title; $("dlgb").textContent = text; $("dlgok").textContent = ok;
    $("dlgno").hidden = !!oneButton;
    const d = $("dlg"), done = v => { d.close(); $("dlgok").onclick = $("dlgno").onclick = null; res(v); };
    $("dlgok").onclick = () => done(true); $("dlgno").onclick = () => done(false);
    d.showModal();
  });
}
const tell = (title, text) => ask(title, text, "Понятно", true);

/* ---------- о программе и отчёт ---------- */
function openAbout() {
  const v = S.version || "версия неизвестна";
  $("aboutver").textContent = v[0].toUpperCase() + v.slice(1) + ".";
  $("aboutdone").hidden = true;
  $("aboutsave").disabled = false;
  $("about").showModal();
}
$("aboutbtn").onclick = openAbout;
$("aboutclose").onclick = () => $("about").close();
$("aboutsave").onclick = async () => {
  $("aboutsave").disabled = true;
  const r = await post("/api/report_problem", {note: $("aboutnote").value});
  const done = $("aboutdone");
  done.hidden = false;
  done.textContent = r.path ? "Отчёт сохранён на рабочий стол, папка открыта в проводнике:\n" + r.path.split("\\").pop() : "Не получилось: " + (r.error || "неизвестная ошибка");
  $("aboutsave").disabled = false;
};
// Ошибки страницы — в журнал ошибок программы, чтобы они попали в отчёт.
let clientErrors = 0;
function reportClientError(text) {
  if (clientErrors++ > 20) return;
  try { post("/api/client_error", {message: text}).catch(() => {}); } catch (e) {}
}
window.addEventListener("error", e => reportClientError((e.message || "ошибка") + " @" + (e.lineno || "?") + ":" + (e.colno || "?") + (e.error && e.error.stack ? "\n" + e.error.stack : "")));
window.addEventListener("unhandledrejection", e => reportClientError("promise: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));

const TABS = [["pick", "Папка"], ["settings", "Настройки"], ["report", "Анализ и раскладка"], ["review", "Разбор похожих"], ["check", "Без даты"], ["finish", "Итог"], ["history", "История и откат"]];
// Шаги по порядку: номер и галочка на вкладке, подсказка «Следующий шаг» над экраном.
// Вкладки остаются: ходить между ними можно в любом порядке.
const STEP_DONE = {
  pick: () => !!S.root,
  settings: () => !!S.analysis,
  report: () => !!S.analysis && !S.layout_moves,
  review: () => !!S.analysis && S.review_unseen === 0 && S.review_pending === 0,
  check: () => !!S.analysis && !S.layout_moves && !S.undated,
};
const STEP_IDS = ["pick", "settings", "report", "review", "check", "finish"];
function nextStep() {
  const j = S.job;
  if (j && j.status === "running") {
    const what = {analyze: "Идёт анализ", layout: "Идёт раскладка", review: "Применяются итоги разбора", check: "Файлы переезжают по указанным датам", rollback: "Идёт отмена операции"}[j.name] || "Идёт работа";
    return {id: "report", text: what + (j.total ? ": " + Math.round(100 * j.done / j.total) + "%" : "") + ".", label: "Посмотреть"};
  }
  if (!S.root) return {id: "pick", text: "Выберите папку или диск с фото.", label: "Выбрать папку"};
  if (!S.analysis) return {id: "settings", text: "Проверьте настройки и запустите анализ. Файлы при этом не меняются.", label: "К настройкам"};
  if (S.layout_moves) return {id: "report", text: "Разложите файлы по годам. Ждут раскладки: " + num(S.layout_moves) + ".", label: "К плану раскладки"};

async function importReview(file) {

    return tell("Снимков из файла здесь нет", "В файле «" + file.name + "» строк с пометками: " + num(r.lines) + ", но ни один снимок не нашёлся в этой папке." +
      (r.already_removed ? "\nУже лежат в «_Удалить»: " + num(r.already_removed) + "." : "") + examples +
      "\n\nПроверьте, что выбрана та же папка или диск, для которого делался разбор.");
  }
  let t = "Файл «" + file.name + "».\nНашлось снимков: " + num(r.found) + " (убрать — " + num(r.drop) + ", оставить — " + num(r.keep) + ").";
  if (r.already_removed) t += "\nУже лежат в «_Удалить»: " + num(r.already_removed) + ".";

  if (r.not_photo) t += "\nНе фото: " + num(r.not_photo) + ".";

// Файлы из «_Проверить»: человек указывает год или месяц, программа переносит их в папки по годам.
let ck = {offset: 0, picked: new Set()};
const MONTHS = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];

async function setDates(pairs) {
  const r = await post("/api/check/set", {values: pairs});

}
function dateEditor(onPick) {

      el("code", {}, "Копия этого снимка"), el("span", {}, "→"), el("code", {}, "_Дубли"),
      el("code", {}, "Снимок с неясной датой"), el("span", {}, "→"), el("code", {}, "_Проверить")),
    el("p", {}, "Посмотрите, что куда переедет, и нажмите «Разложить файлы». До этого на диске ничего не перемещается."),
    el("p", {cls: "mut"}, "Для снимков из «_Проверить» дату можно указать потом на вкладке «Без даты». Программа подскажет её по соседним кадрам и названию папки.")]},
  {title: "Попробуйте выбрать кадры", draw: drawTourPractice},
  {title: "Последний шаг за вами", draw: () => [
    el("p", {}, "Снимки с пометкой «Убрать» не удаляются, а переезжают в папку «_Удалить»."),
    el("div", {cls: "points"},
      el("div", {cls: "point"}, el("span", {cls: "num"}, "1"), el("span", {}, el("b", {}, "Вкладка «Итог»"), "Откройте «_Удалить», проверьте и удалите папку сами. После этого файлы уже не вернуть.")),
      el("div", {cls: "point"}, el("span", {cls: "num"}, "2"), el("span", {}, el("b", {}, "Вкладка «История и откат»"), "Передумали? Отмените последнюю операцию, и файлы вернутся на свои места."))),
    el("p", {}, "Вкладки пронумерованы по порядку работы, а над экраном подсказка «Следующий шаг» говорит, что сделать дальше."),
    el("p", {}, "Фото на внешнем диске? Перед тем как его отключить, нажмите вверху «Пауза»."),
    el("p", {cls: "mut"}, "Вернуться к обучению можно кнопкой «Обучение» вверху.")]},
];
const PRACTICE = 3;
let tour = {step: 0, marks: [true, false, true], tried: false};
function drawTourPractice() {
  const tiles = [["down", "Кадр 1"], ["down", "Кадр 2: почти такой же"], ["up", "Кадр 3: другая поза"]];
  const grid = el("div", {cls: "demo"});
  const feedback = el("p", {id: "tourfeedback", cls: "mut", "aria-live": "polite"});
  const draw = () => {
    grid.textContent = "";
    tiles.forEach(([arms, label], i) => {
      const keep = tour.marks[i];
      const toggle = () => { tour.marks[i] = !tour.marks[i]; tour.tried = true; draw(); };
      grid.append(el("div", {cls: "ph " + (keep ? "keep" : "drop"), role: "button", tabindex: 0, "aria-pressed": String(keep),
        on: {click: toggle, keydown: e => { if (e.key === " ") { e.preventDefault(); toggle(); } }}},
        el("div", {cls: "mark"}, el("span", {cls: "badge"}, keep ? "Оставить" : "Убрать"),
          btn("Только это", e => { e.stopPropagation(); tour.marks = tour.marks.map((_, n) => n === i); tour.tried = true; draw(); })),
        el("div", {innerHTML: demoScene(arms)}), el("div", {cls: "info"}, label, ", клавиша " + (i + 1))));
    });
    const kept = tour.marks.filter(Boolean).length;
    feedback.textContent = !tour.tried ? "Попробуйте: нажмите на снимок или клавишу 1, 2 или 3." :
      kept === 0 ? "Убраны все кадры. В настоящем разборе программа предупредит об этом перед применением." :
      "Получилось. Оставлено: " + kept + ", убрано: " + (3 - kept) + ".";
  };
  draw();
  return [el("p", {}, "На вкладке «Разбор похожих» снимки одной съёмки показаны вместе. Копии уже помечены «Убрать», но решаете вы. Это только пример."), grid, feedback,
    el("p", {cls: "mut"}, "В настоящем разборе «Дальше» или Enter открывает следующую группу. Группы, которые вы не смотрели, останутся как есть. Если рядом лежат снимок айфона и его правка (IMG_E…), программа подпишет правку, а клавиша 0 уберёт все правки в группе.")];
}
function drawTour() {
  const s = TOUR[tour.step], last = tour.step === TOUR.length - 1;
  const dots = $("tourdots"); dots.textContent = "";
  TOUR.forEach((_, i) => dots.append(el("i", {cls: i <= tour.step ? "on" : ""})));
  $("tourstep").textContent = "Шаг " + (tour.step + 1) + " из " + TOUR.length;
  const body = $("tourbody"); body.textContent = ""; body.scrollTop = 0;
  body.append(el("h2", {id: "tourtitle"}, s.title), ...s.draw());
  const next = btn(last ? "Начать работу" : "Дальше", () => last ? closeTour() : tourGo(1), "main");
  const foot = $("tourfoot"); foot.textContent = "";
  foot.append(last ? el("span") : btn("Пропустить", closeTour),
    el("div", {cls: "row"}, tour.step ? btn("Назад", () => tourGo(-1)) : null, next));
  next.focus();
}
function tourGo(d) { tour.step = Math.max(0, Math.min(TOUR.length - 1, tour.step + d)); drawTour(); }
function openTour() {
  tour = {step: 0, marks: [true, false, true], tried: false};
  drawTour();
  $("tour").showModal();
  $("tourfoot").querySelector("button.main").focus();
}
function closeTour() {
  if ($("tour").open) $("tour").close();
  post("/api/tutorial/done");
  S.tutorial_done = true;
}
function tourKey(e) {
  if (e.key === "ArrowRight") { e.preventDefault(); if (tour.step < TOUR.length - 1) tourGo(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); if (tour.step) tourGo(-1); }
  else if (tour.step === PRACTICE && "123".includes(e.key)) { e.preventDefault(); $("tourbody").querySelectorAll(".ph")[+e.key - 1].click(); }
}
$("tour").addEventListener("cancel", e => { e.preventDefault(); closeTour(); });  // Esc — то же, что «Пропустить»
$("tourbtn").addEventListener("click", openTour);

$("quit").addEventListener("click", async () => {
  if (S.job && S.job.status === "running") {
    const ok = await ask("Работа ещё идёт", "Остановить её и выйти? Продолжить можно при следующем запуске.", "Остановить и выйти");
    if (!ok) return;
    await post("/api/cancel");
  }
  await post("/api/quit");
  document.body.textContent = "";
  document.body.append(el("div", {style: "padding:40px;text-align:center"}, "Программа закрыта. Это окно можно закрыть."));
  window.close();
});
// Каждое окно отзывается программе. Когда закрывают последнее окно, программа завершается сама.
const PAGE = Math.random().toString(36).slice(2) + Date.now().toString(36);
const ping = () => post("/api/ping", {page: PAGE}).catch(() => {});
ping();
setInterval(ping, 30000);
addEventListener("pagehide", () => {
  fetch("/api/bye", {method: "POST", keepalive: true, headers: {"X-Token": TOKEN, "Content-Type": "application/json"}, body: JSON.stringify({page: PAGE})});
});
(async () => {
  await refresh();
  await go(S.root ? "report" : "pick");
  if (!S.tutorial_done) openTour();
})();
</script>
</body>
</html>
